<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>feelya | Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__top">
      <a href="/" class="sidebar__logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><circle cx="14" cy="14" r="14" fill="url(#slg)"/><path d="M8 14.5C8 14.5 10.5 9 14 9C17.5 9 20 14.5 20 14.5C20 14.5 17.5 20 14 20C10.5 20 8 14.5 8 14.5Z" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="14" cy="14.5" r="2.5" fill="#fff"/><defs><linearGradient id="slg" x1="0" y1="0" x2="28" y2="28"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs></svg>
        <span>feelya</span>
      </a>

      <!-- Org badge (shown for org members) -->
      <div class="sidebar__org" id="sidebarOrg" style="display:none;">
        <div class="sidebar__org-name" id="sidebarOrgName"></div>
      </div>

      <nav class="sidebar__nav">
        <!-- Admin section (shown for admins) -->
        <div class="sidebar__section" id="adminSection" style="display:none;">
          <div class="sidebar__section-label">Organisation</div>
          <a href="/app/org" class="sidebar__link" data-page="org">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 3h7v7H3V3zm10 0h4v4h-4V3zM3 13h4v4H3v-4zm10 3.5a3.5 3.5 0 11-7 0 3.5 3.5 0 017 0z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Org Dashboard
          </a>
          <a href="/app/team" class="sidebar__link" data-page="team">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M14 17v-1a3 3 0 00-3-3H6a3 3 0 00-3 3v1m15-1v-1a3 3 0 00-2.25-2.9M11.5 3.1a3 3 0 010 5.8M8.5 9a3 3 0 100-6 3 3 0 000 6z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Team
          </a>
        </div>

        <div class="sidebar__section-label" id="personalLabel">Personal</div>
        <a href="/app/dashboard" class="sidebar__link" data-page="dashboard">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 10l7-7 7 7M5 8.5V16a1 1 0 001 1h3v-4h2v4h3a1 1 0 001-1V8.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Dashboard
        </a>
        <a href="/app/therapists" class="sidebar__link" data-page="therapists">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M17 17v-1a4 4 0 00-3-3.87M13 3.13a4 4 0 010 7.75M9 9a4 4 0 100-8 4 4 0 000 8zm0 2c-4 0-7 2-7 4v2h14v-2c0-2-3-4-7-4z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Find a Therapist
        </a>
        <a href="/app/sessions" class="sidebar__link" data-page="sessions">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="3" y="4" width="14" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M13 2v4M7 2v4M3 8h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          Sessions
        </a>
        <a href="/app/resources" class="sidebar__link" data-page="resources">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 4h5l2 2h5a1 1 0 011 1v8a1 1 0 01-1 1H4a1 1 0 01-1-1V5a1 1 0 011-1z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Resources
        </a>
        <a href="/app/notifications" class="sidebar__link" data-page="notifications">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 2a6 6 0 00-6 6v3l-1.5 2.5h15L16 11V8a6 6 0 00-6-6z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 15.5a2.5 2.5 0 005 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          Notifications
          <span class="sidebar__badge" id="notifBadge" style="display:none;">0</span>
        </a>
      </nav>
    </div>
    <div class="sidebar__bottom">
      <a href="/app/profile" class="sidebar__link" data-page="profile">
        <div class="sidebar__avatar" id="sidebarAvatar">U</div>
        <span id="sidebarName">My Profile</span>
      </a>
      <button class="sidebar__link sidebar__logout" id="logoutBtn">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M7 17H4a1 1 0 01-1-1V4a1 1 0 011-1h3M13 14l4-4-4-4M17 10H7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Log Out
      </button>
    </div>
  </aside>

  <!-- Mobile header -->
  <header class="mobile-header" id="mobileHeader">
    <button class="mobile-header__burger" id="sidebarToggle">
      <span></span><span></span><span></span>
    </button>
    <a href="/" class="mobile-header__logo">feelya</a>
    <div class="mobile-header__avatar" id="mobileAvatar">U</div>
  </header>

  <!-- Main Content -->
  <main class="main" id="main">
    <div class="main__content" id="pageContent">
      <!-- Dynamic content loaded here -->
    </div>
  </main>

  <!-- Booking Modal -->
  <div class="modal-overlay" id="bookingModal" style="display:none;">
    <div class="modal">
      <button class="modal__close" onclick="closeBookingModal()">&times;</button>
      <h2 class="modal__title">Book a Session</h2>
      <div id="bookingContent"></div>
    </div>
  </div>

  <!-- Therapist Profile Modal -->
  <div class="modal-overlay" id="profileModal" style="display:none;">
    <div class="modal modal--lg">
      <button class="modal__close" onclick="closeProfileModal()">&times;</button>
      <div id="therapistProfileContent"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
